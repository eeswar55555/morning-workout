<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<title>Exercise viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b141a; color: #e8f1f5; font: 500 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; }
  #picker { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #0e1a21; scrollbar-width: none; }
  #picker::-webkit-scrollbar { display: none; }
  #picker button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,.14); background: #16252e; color: inherit; font: inherit; cursor: pointer; }
  #picker button.on { background: #14b8a6; border-color: #14b8a6; color: #04201d; font-weight: 650; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="picker" role="tablist" aria-label="Exercises"></div>
<script src="../figure.js"></script>
<script src="../exercises.js"></script>
<script src="../viz-config.js"></script>
<script type="module" src="/src/playground.jsx"></script>
</body>
</html>
