<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise illustrations</title>
<link rel="stylesheet" href="figure.css">
<style>
  :root { --bg: #f3f7f6; --text: #12262b; --muted: #4c6168; --card: #fff; --line: #d3e0de; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1a1f; --text: #e8f1f0; --muted: #9bb0b6; --card: #172429; --line: #28393f; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 1.3rem; margin: 18px 14px 4px; } p.sub { margin: 0 14px 14px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 0 12px 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .demo { aspect-ratio: 260 / 176; }
  .demo svg { width: 100%; height: 100%; display: block; }
  .card h2 { font-size: 1rem; margin: 10px 12px 2px; } .card small { display: block; margin: 0 12px 12px; color: var(--muted); }
  .tag { display: inline-block; font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--line); margin-left: 6px; vertical-align: 1px; }
</style>
</head>
<body>
<h1>Exercise illustrations</h1>
<p class="sub">Every exercise in the library (data/exercises). Pictures live in animations.js. Add <code>?t=0.5</code> to freeze at a loop position (0 = start, 0.5 = end), <code>&amp;f=1</code> for the female style.</p>
<div class="grid" id="grid"></div>
<script src="figure.js"></script>
<script src="animations.js"></script>
<script src="illus.js"></script>
<script src="face.js"></script>
<script src="catalog.js"></script>
<script>
  var q = new URLSearchParams(location.search), freeze = q.has('t') ? parseFloat(q.get('t')) : null, figs = [];
  if (q.get('f') === '1') Illus.female = true;
  Catalog.load().then(function () {
    Catalog.exercises.forEach(function (ex) {
      var c = document.createElement('div'); c.className = 'card';
      var d = document.createElement('div'); d.className = 'demo'; c.appendChild(d);
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'fig'); d.appendChild(svg);
      var h = document.createElement('h2'); h.textContent = ex.name;
      var t = document.createElement('span'); t.className = 'tag'; t.textContent = ex.anim.placeholder ? 'no picture yet' : ex.anim.face ? 'face' : ((ex.anim._cfg || {}).view || 'side'); h.appendChild(t); c.appendChild(h);
      var s = document.createElement('small'); s.textContent = ex.id + ' · ' + ex.area; c.appendChild(s);
      document.getElementById('grid').appendChild(c);
      var fig = Figure.create(svg); fig.setAnim(ex.anim, false); figs.push({ fig: fig, ex: ex });
    });
    var t0 = performance.now();
    function frame(now) {
      figs.forEach(function (f) {
        var per = f.ex.tempoSeconds || 4, u = freeze != null ? freeze : (((now - t0) / 1000) / per) % 1;
        f.fig.show({ u: u });
      });
      if (freeze == null) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }, function (e) { document.getElementById('grid').textContent = 'Could not load data: ' + e.message + ' (serve this folder over http)'; });
</script>
</body>
</html>
